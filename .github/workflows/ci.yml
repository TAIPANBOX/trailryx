name: ci

# The same fifteen checks `.githooks/pre-push` runs, so a green push is a green pull
# request and neither can drift from the other.
#
# THE GUARD ON `if:` STAYS, and it is not decoration. Actions minutes are metered on
# a private repository and free on a public one. This file was written while the
# repository was still private, so every job was skipped and cost nothing; the
# repository went public on 30 July 2026 and the condition released itself, which is
# why it was written as a condition rather than as a note to remember later.
#
# It is kept because it works in both directions: if this repository is ever made
# private again, CI stops billing on its own rather than on somebody noticing.
# Deleting the line is a billing decision, not a tidy-up.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version && cargo --version

      # Warnings are failures: a warning nobody fixes is a warning everybody stops
      # reading.
      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --quiet -- -D warnings

      - name: cargo test
        run: cargo test --workspace --quiet

      # The substrate must stand on its own. Trivially true today, and the day it
      # would stop being true, it breaks here.
      - name: sim crate builds standalone
        run: cargo test -p trailryx-sim --quiet

      # Not an aesthetic: the offline verifier has to be small enough for an auditor
      # to read, and every crate pulled in is a crate somebody has to trust. Narrowed
      # from "workspace-wide" on 30 July 2026, when the SQL facade took DataFusion.
      # The claim follows the reality rather than the other way round.
      - name: zero deps outside the declared
        run: ./scripts/declared-deps.sh

      # The core has to stand up with every adapter absent, which §3.2a requires by
      # name for the facade and §2a extends to the rest. The exclusions come from the
      # same file as the check above, because these two held their own copies of the
      # list once and drifted the first time it changed.
      - name: core builds without adapters
        run: cargo test --workspace $(./scripts/declared-deps.sh list) --quiet

      # One file, shared with .githooks/pre-push, so the two cannot drift.
      - name: no unsafe
        run: ./scripts/no-unsafe.sh

      # The exit criterion of stage 0, checked on every push rather than once. If a
      # seed stops reproducing a run, every guarantee built on the simulator stops
      # meaning anything.
      - name: determinism, same seed twice
        run: ./scripts/determinism.sh

      # Trivially green today, and that is the point rather than an excuse: with zero
      # dependencies there is nothing to audit, so this check exists for the day one
      # arrives. The same argument as the standalone substrate build above. Free
      # now that the repository is public; it would have been a billable minute
      # before.
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit

      # The published seed corpus: every recorded run must still produce the digest and
      # the violation count written down for it. A determinism check, not a
      # correctness one, and `sim/corpus.tsv` says so in its own header.
      - name: seed corpus reproduces
        run: ./scripts/seed-corpus.sh

      # Two verifiers, one pack: the Rust one and `verifier-py/trailryx_verify.py`.
      # Two implementations that agree prove the format rather than the author.
      - name: two verifiers agree
        run: cargo test -p trailryx-store --test two_verifiers --quiet

      # The same source must produce the same verifier binary from any directory, or
      # an auditor cannot check the binary they run against the source they read.
      - name: verifier build is reproducible
        run: ./scripts/reproduce.sh

      # A feature nobody builds is a feature that rots, and this one only shows up
      # in a deployment when it breaks.
      - name: the TLS builds still work
        run: ./scripts/tls-builds.sh

      # Every hand-written parser, fed bytes it did not expect. Ten times the
      # gate's volume here, because CI has the minutes and a fuzzer's value is
      # roughly linear in cases.
      - name: parsers survive hostile bytes
        run: TRAILRYX_FUZZ_CASES=3000 cargo test -p trailryx-fuzz --release --quiet

      # Every number the README states about this repository, against the repository.
      # A README number is a claim with no owner, and an audit on 30 July 2026 found
      # six crate counts drifted, a dependency figure no reading of the tree
      # reproduced, and a line off by a factor of two. None was a lie when written.
      - name: README numbers are true
        run: ./scripts/readme-numbers.sh

      # Enough to catch a write-path regression. The long sweep belongs in a nightly.
      - name: durability sweep, 200 seeds
        run: ./scripts/durability-sweep.sh
