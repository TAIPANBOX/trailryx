[workspace]
resolver = "3"
members = ["crates/trailryx-sim", "crates/trailryx-record", "crates/trailryx-crypto", "crates/trailryx-contracts", "crates/trailryx-journal", "crates/trailryx-index", "crates/trailryx-store", "crates/trailryx-otlp", "crates/trailryx-erasure", "crates/trailryx-verify", "crates/trailryx-core"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/TAIPANBOX/trailryx"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
