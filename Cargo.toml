[workspace]
resolver = "3"
members = ["crates/trailryx-sim", "crates/trailryx-record", "crates/trailryx-crypto", "crates/trailryx-contracts", "crates/trailryx-journal", "crates/trailryx-index", "crates/trailryx-store", "crates/trailryx-json", "crates/trailryx-otlp", "crates/trailryx-erasure", "crates/trailryx-verify", "crates/trailryx-projection", "crates/trailryx-sign", "crates/trailryx-ingest", "crates/trailryx-assemble", "crates/trailryx-demo", "crates/trailryx-core", "crates/trailryx-asn1", "crates/trailryx-anchor", "crates/trailryx-compliance", "crates/trailryx-sql", "crates/trailryx-s3", "crates/trailryx-http", "crates/trailryx-publish", "crates/trailryx-crypto-aws", "crates/trailryx-azure", "crates/trailryx-federation", "crates/trailryx-federation-grpc", "crates/trailryx-fuzz", "crates/trailryx-node", "crates/trailryx-agentevent"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/TAIPANBOX/trailryx"
rust-version = "1.85"

# Tests run optimised. The P-384 verifier is real modular arithmetic and an
# exhaustive bit sweep over a signature is seven minutes unoptimised and half a
# minute optimised. The checks that catch bugs are kept on explicitly, so this
# buys speed and gives up nothing: overflow still panics, assertions still fire.
#
# Debug info is the other half of what a test build writes. Full debug info in
# every linked test binary was most of the bytes a rebuild put on disk, and the
# dependencies' share of it (DataFusion and everything under it) is read by no
# panic message here. Line tables are kept for the workspace's own crates, so a
# panic and a backtrace still name file and line. `test` inherits both from `dev`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
