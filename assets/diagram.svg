<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 996 386" width="996" height="386" role="img" aria-label="Trailryx: two OTLP transports feed one mapper, which splits every event into typed metadata and an encrypted payload, and the chain of commitments above them is what an offline verifier recomputes">
  <title>Trailryx: two transports, one mapper, one plane boundary, and a chain of commitments an offline verifier recomputes from the record bytes</title>
  <rect x="-18" y="-18" width="996" height="386" rx="16" fill="#0A0E13"/>
  <rect x="-17.5" y="-17.5" width="995" height="385" rx="15.5" fill="none" stroke="rgba(255,255,255,.09)"/>

  <defs><marker id="tr1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5A6675"/></marker></defs>

  <g font-family="ui-monospace,Menlo" text-anchor="middle">

    <rect x="14" y="46" width="180" height="66" rx="12" fill="#141C27" stroke="#2a3547"/>
    <text x="104" y="70" fill="#E9EFF6" font-size="11.5" font-weight="700">OTLP / HTTP</text>
    <text x="104" y="87" fill="#8A97A6" font-size="10.5">protobuf on a socket</text>
    <text x="104" y="103" fill="#5A6675" font-size="10.5">loopback, gzip, ours</text>

    <rect x="14" y="128" width="180" height="66" rx="12" fill="#141C27" stroke="#2a3547"/>
    <text x="104" y="152" fill="#E9EFF6" font-size="11.5" font-weight="700">OTLP / JSON file</text>
    <text x="104" y="169" fill="#8A97A6" font-size="10.5">one envelope per line</text>
    <text x="104" y="185" fill="#5A6675" font-size="10.5">what a collector writes</text>

    <rect x="14" y="210" width="180" height="66" rx="12" fill="#141C27" stroke="#2a3547"/>
    <text x="104" y="234" fill="#E9EFF6" font-size="11.5" font-weight="700">the store itself</text>
    <text x="104" y="251" fill="#8A97A6" font-size="10.5">erasure and loss records</text>
    <text x="104" y="267" fill="#5A6675" font-size="10.5">a gap nobody wrote down</text>

    <rect x="246" y="14" width="280" height="318" rx="16" fill="#10161F" stroke="#E4626F" stroke-width="1.4"><animate attributeName="stroke-opacity" values="1;.45;1" dur="3.4s" repeatCount="indefinite"/></rect>
    <text x="386" y="42" fill="#E4626F" font-size="14" font-weight="700">trailryx core</text>
    <text x="386" y="60" fill="#5A6675" font-size="10.5">two decoders, one meaning</text>

    <rect x="266" y="78" width="240" height="62" rx="10" fill="#141C27" stroke="#2a3547"/>
    <text x="386" y="102" fill="#E9EFF6" font-size="11" font-weight="700">GenAI semconv mapper</text>
    <text x="386" y="119" fill="#8A97A6" font-size="10.5">nothing repaired, nothing guessed</text>
    <text x="386" y="134" fill="#5A6675" font-size="10.5">stamped on every record it makes</text>

    <rect x="266" y="152" width="114" height="76" rx="10" fill="#141C27" stroke="#2a3547"/>
    <text x="323" y="175" fill="#E9EFF6" font-size="10.5" font-weight="700">metadata</text>
    <text x="323" y="192" fill="#8A97A6" font-size="10.5">provable</text>
    <text x="323" y="208" fill="#8A97A6" font-size="10.5">indexed</text>
    <text x="323" y="222" fill="#5A6675" font-size="10.5">kept forever</text>

    <rect x="392" y="152" width="114" height="76" rx="10" fill="#141C27" stroke="#E4626F"/>
    <text x="449" y="175" fill="#E9EFF6" font-size="10.5" font-weight="700">payload</text>
    <text x="449" y="192" fill="#8A97A6" font-size="10.5">encrypted</text>
    <text x="449" y="208" fill="#8A97A6" font-size="10.5">own key</text>
    <text x="449" y="222" fill="#E4626F" font-size="10.5">erasable</text>

    <rect x="266" y="240" width="240" height="76" rx="10" fill="#141C27" stroke="#2a3547"/>
    <text x="386" y="264" fill="#E9EFF6" font-size="11" font-weight="700">journal, one per shard</text>
    <text x="386" y="281" fill="#8A97A6" font-size="10.5">append only, hash chained</text>
    <text x="386" y="297" fill="#8A97A6" font-size="10.5">acked survives any crash</text>
    <text x="386" y="311" fill="#5A6675" font-size="10.5">and that is the whole contract</text>

    <rect x="560" y="14" width="386" height="166" rx="14" fill="#10161F" stroke="#2a3547"/>
    <text x="753" y="42" fill="#E9EFF6" font-size="12.5" font-weight="700">what gets committed to</text>
    <text x="753" y="66" fill="#8A97A6" font-size="10.5">segment: Merkle history over the chain links</text>
    <text x="753" y="86" fill="#8A97A6" font-size="10.5">five sorted indexes, one per provable dimension</text>
    <text x="753" y="106" fill="#8A97A6" font-size="10.5">segment root, shard root, store root</text>
    <text x="753" y="130" fill="#E4626F" font-size="10.5">an answer carries the boundary either side of it,</text>
    <text x="753" y="147" fill="#E4626F" font-size="10.5">so an omitted record has nowhere left to hide</text>
    <text x="753" y="167" fill="#5A6675" font-size="10.5">RFC 6962 leaf and node prefixes, SHA-384</text>

    <rect x="560" y="200" width="386" height="132" rx="14" fill="#10161F" stroke="#2a3547"/>
    <text x="753" y="228" fill="#93A8C4" font-size="12.5" font-weight="700">evidence pack</text>
    <text x="753" y="250" fill="#8A97A6" font-size="10.5">store root signed P-384, witnessed by somebody else</text>
    <text x="753" y="270" fill="#8A97A6" font-size="10.5">checked by a verifier that depends on nothing:</text>
    <text x="753" y="286" fill="#8A97A6" font-size="10.5">its own SHA-384, its own ECDSA, its own reader</text>
    <text x="753" y="308" fill="#5A6675" font-size="10.5">destroying a payload key changes none of the four</text>
    <text x="753" y="324" fill="#5A6675" font-size="10.5">fields a record commits to, so every root still holds</text>
  </g>

  <g stroke="#5A6675" stroke-width="1.5">
    <line x1="194" y1="79" x2="238" y2="79" marker-end="url(#tr1)"/>
    <line x1="194" y1="161" x2="238" y2="161" marker-end="url(#tr1)"/>
    <line x1="194" y1="243" x2="238" y2="243" marker-end="url(#tr1)"/>
    <line x1="526" y1="97" x2="552" y2="97" marker-end="url(#tr1)"/>
    <line x1="526" y1="278" x2="552" y2="278" marker-end="url(#tr1)"/>
  </g>

  <g fill="none">
    <line x1="194" y1="79" x2="238" y2="79" pathLength="100" stroke="#E4626F" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="0s" repeatCount="indefinite"/></line>
    <line x1="194" y1="161" x2="238" y2="161" pathLength="100" stroke="#E4626F" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-0.48s" repeatCount="indefinite"/></line>
    <line x1="194" y1="243" x2="238" y2="243" pathLength="100" stroke="#E4626F" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-0.96s" repeatCount="indefinite"/></line>
    <line x1="526" y1="97" x2="552" y2="97" pathLength="100" stroke="#E4626F" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-1.44s" repeatCount="indefinite"/></line>
    <line x1="526" y1="278" x2="552" y2="278" pathLength="100" stroke="#E4626F" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-1.92s" repeatCount="indefinite"/></line>
  </g>
</svg>
