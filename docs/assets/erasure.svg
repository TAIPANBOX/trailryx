<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 996 340" width="996" height="340" role="img" aria-label="Erasing one person: a record commits to four fields about its payload and does not contain it, so destroying the key leaves every chain, root and proof unchanged">
  <title>Erasing one person without breaking the audit trail: the four fields a record commits to, and why none of them moves</title>
  <rect x="-18" y="-18" width="996" height="340" rx="16" fill="#0A0E13"/>
  <rect x="-17.5" y="-17.5" width="995" height="339" rx="15.5" fill="none" stroke="rgba(255,255,255,.09)"/>

  <defs><marker id="er1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5A6675"/></marker></defs>

  <g font-family="ui-monospace,Menlo" text-anchor="middle">
    <text x="480" y="22" fill="#E9EFF6" font-size="13" font-weight="700">nothing is deleted, and the person is still forgotten</text>
    <text x="480" y="42" fill="#5A6675" font-size="10.5">the object store has no delete method, because a design that needs one fails the first time a backup is restored</text>

    <rect x="14" y="66" width="286" height="146" rx="12" fill="#10161F" stroke="#2a3547"/>
    <text x="157" y="90" fill="#E9EFF6" font-size="11.5" font-weight="700">the record, in the clear</text>
    <text x="157" y="114" fill="#8A97A6" font-size="10.5">payload.hash</text>
    <text x="157" y="132" fill="#8A97A6" font-size="10.5">payload.size_bytes</text>
    <text x="157" y="150" fill="#8A97A6" font-size="10.5">payload.class</text>
    <text x="157" y="168" fill="#8A97A6" font-size="10.5">payload.key_id</text>
    <text x="157" y="192" fill="#5A6675" font-size="10.5">four fields about the payload,</text>
    <text x="157" y="206" fill="#5A6675" font-size="10.5">and not the payload itself</text>

    <rect x="330" y="66" width="286" height="146" rx="12" fill="#10161F" stroke="#E4626F"/>
    <text x="473" y="90" fill="#E4626F" font-size="11.5" font-weight="700">the payload, sealed</text>
    <text x="473" y="114" fill="#8A97A6" font-size="10.5">prompts, completions, tool results</text>
    <text x="473" y="132" fill="#8A97A6" font-size="10.5">every attribute nobody mapped</text>
    <text x="473" y="156" fill="#8A97A6" font-size="10.5">one key per record, never per person:</text>
    <text x="473" y="174" fill="#8A97A6" font-size="10.5">a shared key id would let anybody</text>
    <text x="473" y="192" fill="#8A97A6" font-size="10.5">group the store by subject from</text>
    <text x="473" y="206" fill="#8A97A6" font-size="10.5">metadata alone</text>

    <rect x="646" y="66" width="300" height="146" rx="12" fill="#10161F" stroke="#93A8C4"/>
    <text x="796" y="90" fill="#93A8C4" font-size="11.5" font-weight="700">forget, on request</text>
    <text x="796" y="114" fill="#8A97A6" font-size="10.5">destroy every key in the subject row</text>
    <text x="796" y="132" fill="#8A97A6" font-size="10.5">then drop the row, in that order</text>
    <text x="796" y="156" fill="#8A97A6" font-size="10.5">the other order loses the keys nobody</text>
    <text x="796" y="174" fill="#8A97A6" font-size="10.5">knows to destroy, and one KMS timeout</text>
    <text x="796" y="192" fill="#8A97A6" font-size="10.5">then leaves a store that believes it</text>
    <text x="796" y="206" fill="#8A97A6" font-size="10.5">erased somebody and did not</text>

    <rect x="14" y="236" width="932" height="66" rx="12" fill="#141C27" stroke="#E4626F" stroke-width="1.4"><animate attributeName="stroke-opacity" values="1;.45;1" dur="3.4s" repeatCount="indefinite"/></rect>
    <text x="480" y="260" fill="#E4626F" font-size="11.5" font-weight="700">destroying a key changes none of the four fields</text>
    <text x="480" y="280" fill="#8A97A6" font-size="10.5">so every hash chain, every Merkle root and every proof issued before the erasure still verifies afterwards, unchanged</text>
    <text x="480" y="296" fill="#5A6675" font-size="10.5">which is a test and not a claim: seal, prove, erase, prove again, and the ciphertext is still in every replica and unreadable in all of them</text>
  </g>

  <g stroke="#5A6675" stroke-width="1.5">
    <line x1="300" y1="139" x2="322" y2="139" marker-end="url(#er1)"/>
    <line x1="616" y1="139" x2="638" y2="139" marker-end="url(#er1)"/>
  </g>

  <g fill="none">
    <line x1="300" y1="139" x2="322" y2="139" pathLength="100" stroke="#E4626F" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.6s" begin="0s" repeatCount="indefinite"/></line>
    <line x1="616" y1="139" x2="638" y2="139" pathLength="100" stroke="#E4626F" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.6s" begin="-1.3s" repeatCount="indefinite"/></line>
  </g>
</svg>
