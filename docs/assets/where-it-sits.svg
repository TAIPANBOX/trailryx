<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 996 470" width="996" height="470" role="img" aria-label="A positioning map: the horizontal axis is whether one person can be erased on request, the vertical axis is what can be proved about an answer. Tamper-evident ledgers prove the history was not rewritten and cannot remove it; observability tools delete freely and prove nothing; Trailryx sits in the corner that does both">
  <title>Where this sits: what a store can prove about an answer, against whether it can still forget a person</title>

  <rect x="-18" y="-18" width="996" height="470" rx="16" fill="#0A0E13"/>
  <rect x="-17.5" y="-17.5" width="995" height="469" rx="15.5" fill="none" stroke="rgba(255,255,255,.09)"/>

  <defs>
    <marker id="ax" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3A4553"/></marker>
  </defs>

  <g font-family="ui-monospace,Menlo">
    <text x="480" y="20" fill="#E9EFF6" font-size="13" font-weight="700" text-anchor="middle">two properties that usually cost each other</text>
    <text x="480" y="39" fill="#5A6675" font-size="10.5" text-anchor="middle">an audit trail defends itself by being unchangeable, and erasure means changing it, so most tools pick a side</text>

    <line x1="200" y1="366" x2="694" y2="366" stroke="#3A4553" stroke-width="1.4" marker-end="url(#ax)"/>
    <line x1="200" y1="366" x2="200" y2="62" stroke="#3A4553" stroke-width="1.4" marker-end="url(#ax)"/>

    <g stroke="#1A2230" stroke-width="1" stroke-dasharray="3 5">
      <line x1="200" y1="248" x2="686" y2="248"/>
      <line x1="200" y1="166" x2="686" y2="166"/>
      <line x1="200" y1="88" x2="686" y2="88"/>
      <line x1="447" y1="366" x2="447" y2="62"/>
    </g>

    <text x="192" y="92" fill="#5A6675" font-size="10.5" text-anchor="end">all of it</text>
    <text x="192" y="170" fill="#5A6675" font-size="10.5" text-anchor="end">append only</text>
    <text x="192" y="252" fill="#5A6675" font-size="10.5" text-anchor="end">each row</text>
    <text x="192" y="362" fill="#5A6675" font-size="10.5" text-anchor="end">nothing</text>
    <text x="42" y="214" fill="#8A97A6" font-size="10.5" font-weight="700" text-anchor="middle" transform="rotate(-90 42 214)">what can be proved</text>

    <text x="204" y="390" fill="#5A6675" font-size="10.5" text-anchor="start">no, not without breaking it</text>
    <text x="686" y="390" fill="#5A6675" font-size="10.5" text-anchor="end">yes, and the proofs hold</text>
    <text x="445" y="414" fill="#8A97A6" font-size="10.5" font-weight="700" text-anchor="middle">can one person be erased on request?</text>

    <g text-anchor="middle">
      <circle cx="278" cy="156" r="6" fill="#141C27" stroke="#93A8C4" stroke-width="1.6"/>
      <text x="278" y="140" fill="#93A8C4" font-size="10.5" font-weight="700">immudb</text>

      <circle cx="356" cy="134" r="6" fill="#141C27" stroke="#93A8C4" stroke-width="1.6"/>
      <text x="356" y="118" fill="#93A8C4" font-size="10.5" font-weight="700">Azure SQL ledger</text>

      <circle cx="392" cy="184" r="6" fill="#141C27" stroke="#93A8C4" stroke-width="1.6"/>
      <text x="392" y="206" fill="#93A8C4" font-size="10.5" font-weight="700">Trillian, CT logs</text>

      <circle cx="246" cy="222" r="6" fill="#141C27" stroke="#3A4553" stroke-width="1.6"/>
      <text x="252" y="244" fill="#5A6675" font-size="10.5">QLDB, withdrawn</text>

      <circle cx="556" cy="300" r="6" fill="#141C27" stroke="#5A6675" stroke-width="1.6"/>
      <text x="556" y="322" fill="#8A97A6" font-size="10.5">agent observability</text>

      <circle cx="634" cy="336" r="6" fill="#141C27" stroke="#5A6675" stroke-width="1.6"/>
      <text x="626" y="356" fill="#8A97A6" font-size="10.5">SIEM, audit log</text>

      <circle cx="620" cy="88" r="9" fill="none" stroke="#E4626F" stroke-width="2">
        <animate attributeName="r" dur="3.2s" repeatCount="indefinite" values="9;16;9"/>
        <animate attributeName="stroke-opacity" dur="3.2s" repeatCount="indefinite" values="1;0;1"/>
      </circle>
      <circle cx="620" cy="88" r="6.5" fill="#E4626F"/>
      <text x="620" y="68" fill="#E4626F" font-size="11.5" font-weight="700">Trailryx</text>
    </g>

    <rect x="700" y="62" width="246" height="126" rx="11" fill="#10161F" stroke="#93A8C4"/>
    <text x="823" y="84" fill="#93A8C4" font-size="11" font-weight="700" text-anchor="middle">the ledgers</text>
    <text x="712" y="106" fill="#8A97A6" font-size="10.5" text-anchor="start">prove the history was not</text>
    <text x="712" y="122" fill="#8A97A6" font-size="10.5" text-anchor="start">rewritten, which is real and useful</text>
    <text x="712" y="144" fill="#5A6675" font-size="10.5" text-anchor="start">Azure documents that deleting</text>
    <text x="712" y="160" fill="#5A6675" font-size="10.5" text-anchor="start">the history is unsupported, and</text>
    <text x="712" y="176" fill="#5A6675" font-size="10.5" text-anchor="start">immudb's deletion is logical</text>

    <rect x="700" y="200" width="246" height="110" rx="11" fill="#10161F" stroke="#5A6675"/>
    <text x="823" y="222" fill="#8A97A6" font-size="11" font-weight="700" text-anchor="middle">the observers</text>
    <text x="712" y="244" fill="#8A97A6" font-size="10.5" text-anchor="start">record what an agent did, and</text>
    <text x="712" y="260" fill="#8A97A6" font-size="10.5" text-anchor="start">delete a row whenever asked</text>
    <text x="712" y="282" fill="#5A6675" font-size="10.5" text-anchor="start">and cannot show an auditor that</text>
    <text x="712" y="298" fill="#5A6675" font-size="10.5" text-anchor="start">nothing was quietly left out</text>

    <rect x="700" y="322" width="246" height="106" rx="11" fill="#141C27" stroke="#E4626F" stroke-width="1.4"><animate attributeName="stroke-opacity" dur="3.4s" repeatCount="indefinite" values="1;.45;1"/></rect>
    <text x="823" y="344" fill="#E4626F" font-size="11" font-weight="700" text-anchor="middle">the corner nobody sat in</text>
    <text x="712" y="366" fill="#8A97A6" font-size="10.5" text-anchor="start">a record commits to four fields</text>
    <text x="712" y="382" fill="#8A97A6" font-size="10.5" text-anchor="start">about a payload it does not hold,</text>
    <text x="712" y="398" fill="#8A97A6" font-size="10.5" text-anchor="start">so the key can die and every</text>
    <text x="712" y="414" fill="#8A97A6" font-size="10.5" text-anchor="start">root still verifies</text>
  </g>
</svg>
