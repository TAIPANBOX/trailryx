<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 996 322" width="996" height="322" role="img" aria-label="A completeness proof: the matching entries with an inclusion proof each, and the entries immediately either side of the range whose keys must fall outside it">
  <title>What a completeness proof actually does: the answer, and the two entries that pin it in a sorted index</title>
  <rect x="-18" y="-18" width="996" height="322" rx="16" fill="#0A0E13"/>
  <rect x="-17.5" y="-17.5" width="995" height="321" rx="15.5" fill="none" stroke="rgba(255,255,255,.09)"/>

  <g font-family="ui-monospace,Menlo" text-anchor="middle">
    <text x="480" y="24" fill="#E9EFF6" font-size="13" font-weight="700">one index, sorted by key, and the four entries that answered</text>
    <text x="480" y="44" fill="#5A6675" font-size="10.5">the query asked for 09:10 to 09:50, and every position between the two boundaries is accounted for</text>

    <rect x="14" y="70" width="86" height="58" rx="9" fill="#141C27" stroke="#2a3547"/>
    <text x="57" y="94" fill="#5A6675" font-size="10.5">index 0</text>
    <text x="57" y="112" fill="#5A6675" font-size="10.5">08:14</text>

    <rect x="110" y="70" width="86" height="58" rx="9" fill="#141C27" stroke="#2a3547"/>
    <text x="153" y="94" fill="#5A6675" font-size="10.5">index 1</text>
    <text x="153" y="112" fill="#5A6675" font-size="10.5">08:31</text>

    <rect x="206" y="70" width="86" height="58" rx="9" fill="#141C27" stroke="#93A8C4" stroke-dasharray="4 3"/>
    <text x="249" y="94" fill="#93A8C4" font-size="10.5" font-weight="700">index 2</text>
    <text x="249" y="112" fill="#93A8C4" font-size="10.5">09:02</text>

    <rect x="302" y="70" width="86" height="58" rx="9" fill="#141C27" stroke="#E4626F"/>
    <text x="345" y="94" fill="#E9EFF6" font-size="10.5" font-weight="700">index 3</text>
    <text x="345" y="112" fill="#E4626F" font-size="10.5">09:15</text>

    <rect x="398" y="70" width="86" height="58" rx="9" fill="#141C27" stroke="#E4626F"/>
    <text x="441" y="94" fill="#E9EFF6" font-size="10.5" font-weight="700">index 4</text>
    <text x="441" y="112" fill="#E4626F" font-size="10.5">09:19</text>

    <rect x="494" y="70" width="86" height="58" rx="9" fill="#141C27" stroke="#E4626F"/>
    <text x="537" y="94" fill="#E9EFF6" font-size="10.5" font-weight="700">index 5</text>
    <text x="537" y="112" fill="#E4626F" font-size="10.5">09:27</text>

    <rect x="590" y="70" width="86" height="58" rx="9" fill="#141C27" stroke="#E4626F"/>
    <text x="633" y="94" fill="#E9EFF6" font-size="10.5" font-weight="700">index 6</text>
    <text x="633" y="112" fill="#E4626F" font-size="10.5">09:44</text>

    <rect x="686" y="70" width="86" height="58" rx="9" fill="#141C27" stroke="#93A8C4" stroke-dasharray="4 3"/>
    <text x="729" y="94" fill="#93A8C4" font-size="10.5" font-weight="700">index 7</text>
    <text x="729" y="112" fill="#93A8C4" font-size="10.5">10:08</text>

    <rect x="782" y="70" width="86" height="58" rx="9" fill="#141C27" stroke="#2a3547"/>
    <text x="825" y="94" fill="#5A6675" font-size="10.5">index 8</text>
    <text x="825" y="112" fill="#5A6675" font-size="10.5">10:51</text>

    <rect x="302" y="140" width="374" height="26" rx="7" fill="none" stroke="#E4626F" stroke-width="1.4"><animate attributeName="stroke-opacity" values="1;.4;1" dur="3s" repeatCount="indefinite"/></rect>
    <text x="489" y="157" fill="#E4626F" font-size="10.5" font-weight="700">the answer: four entries, four inclusion proofs</text>

    <text x="249" y="152" fill="#93A8C4" font-size="10.5">below</text>
    <text x="249" y="167" fill="#93A8C4" font-size="10.5">the range</text>
    <text x="729" y="152" fill="#93A8C4" font-size="10.5">above</text>
    <text x="729" y="167" fill="#93A8C4" font-size="10.5">the range</text>

    <rect x="14" y="188" width="446" height="98" rx="12" fill="#10161F" stroke="#2a3547"/>
    <text x="237" y="212" fill="#E9EFF6" font-size="11.5" font-weight="700">what the proof carries</text>
    <text x="237" y="234" fill="#8A97A6" font-size="10.5">the four entries, each with its own inclusion proof</text>
    <text x="237" y="252" fill="#8A97A6" font-size="10.5">evidence their positions run 3, 4, 5, 6 with no gap</text>
    <text x="237" y="270" fill="#8A97A6" font-size="10.5">the entry either side, and the root they all hang from</text>

    <rect x="476" y="188" width="470" height="98" rx="12" fill="#10161F" stroke="#E4626F"/>
    <text x="711" y="212" fill="#E4626F" font-size="11.5" font-weight="700">what it refuses</text>
    <text x="711" y="234" fill="#8A97A6" font-size="10.5">hiding a record in the middle: a position goes missing</text>
    <text x="711" y="252" fill="#8A97A6" font-size="10.5">hiding one at an end: the boundary key lands inside</text>
    <text x="711" y="270" fill="#8A97A6" font-size="10.5">declaring the index empty: the empty root is a root too</text>
  </g>

  <g stroke="#5A6675" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="249" y1="128" x2="249" y2="140"/>
    <line x1="729" y1="128" x2="729" y2="140"/>
  </g>
</svg>
