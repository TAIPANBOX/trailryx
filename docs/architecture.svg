<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#4493f8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#161d27" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
</defs><rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/><rect x="0" y="0" width="1280" height="720" fill="url(#grid)" opacity="0.5"/><rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>
<text x="1252" y="698" font-size="12.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="end">github.com/TAIPANBOX/trailryx</text>
<text x="40" y="56" font-size="34" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700">trailryx</text>
<text x="216" y="56" font-size="22" fill="#9aa7b8" font-weight="600">- the record plane</text>
<text x="40" y="84" font-size="15" fill="#9aa7b8">A record of what your agents did that nobody can quietly change or shorten.</text>
<line x1="40" y1="100" x2="1240" y2="100" stroke="#222b38" stroke-width="1"/><text x="42" y="138" font-size="12" fill="#9aa7b8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">01 &#183; WHAT GOES IN</text><rect x="40" y="150" width="292" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><rect x="56" y="176" width="260" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="176" width="4" height="62" rx="2" ry="2" fill="#9aa7b8" stroke="#283341" stroke-width="1"/><text x="74" y="200" font-size="14.5" fill="#e6edf3" font-weight="600">OTLP traces</text><text x="74" y="218" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">from a collector, or straight</text><text x="74" y="235" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">over the wire</text><rect x="56" y="254" width="260" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="254" width="4" height="62" rx="2" ry="2" fill="#ff6b63" stroke="#283341" stroke-width="1"/><text x="74" y="278" font-size="14.5" fill="#e6edf3" font-weight="600">the agent-event bus</text><text x="74" y="296" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">the same NDJSON the other</text><text x="74" y="313" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">planes append to</text><text x="60" y="356" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Both, on purpose. The store stays</text><text x="60" y="375" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">useful to somebody who has OTLP</text><text x="60" y="394" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">and no TAIPANBOX at all.</text><text x="60" y="440" font-size="13.5" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">What it refuses is stated:</text><rect x="56" y="456" width="260" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="456" width="4" height="62" rx="2" ry="2" fill="#e3b341" stroke="#283341" stroke-width="1"/><text x="74" y="480" font-size="14.5" fill="#e6edf3" font-weight="600">thirteen event types</text><text x="74" y="498" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">named as refused rather than</text><text x="74" y="515" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">silently dropped</text><text x="60" y="560" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">A run that maps nothing does not</text><text x="60" y="579" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">advance its cursor, so fixing the</text><text x="60" y="598" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">trust domain does not cost you</text><text x="60" y="617" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">the lines it already read.</text><text x="370" y="138" font-size="12" fill="#ff6b63" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">02 &#183; HOW IT HOLDS</text><rect x="368" y="150" width="264" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><rect x="384" y="176" width="232" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="384" y="176" width="4" height="62" rx="2" ry="2" fill="#ff6b63" stroke="#283341" stroke-width="1"/><text x="402" y="200" font-size="14.5" fill="#e6edf3" font-weight="600">one chain per shard</text><text x="402" y="218" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">across as many files as</text><text x="402" y="235" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">it takes</text><rect x="384" y="254" width="232" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="384" y="254" width="4" height="62" rx="2" ry="2" fill="#ff6b63" stroke="#283341" stroke-width="1"/><text x="402" y="278" font-size="14.5" fill="#e6edf3" font-weight="600">sealed with the last</text><text x="402" y="296" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">drop a record from the middle</text><text x="402" y="313" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">and every seal after fails</text><rect x="384" y="332" width="232" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="384" y="332" width="4" height="62" rx="2" ry="2" fill="#ff6b63" stroke="#283341" stroke-width="1"/><text x="402" y="356" font-size="14.5" fill="#e6edf3" font-weight="600">segments, then packs</text><text x="402" y="374" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">and the pack is verified</text><text x="402" y="391" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">before the run exits 0</text><text x="500" y="440" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="middle">arithmetic on the data,</text><text x="500" y="459" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="middle">not a promise about it</text><rect x="392" y="486" width="173" height="22" rx="11" fill="#1a212c" stroke="#3fb950" stroke-width="1.4"/><text x="478.5" y="501" font-size="11" fill="#3fb950" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">unsafe: forbidden</text><rect x="392" y="522" width="191" height="22" rx="11" fill="#1a212c" stroke="#3fb950" stroke-width="1.4"/><text x="487.5" y="537" font-size="11" fill="#3fb950" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">verifier deps: zero</text><text x="500" y="588" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="middle">The verifier is a separate</text><text x="500" y="606" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="middle">binary somebody who does not</text><text x="500" y="624" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="middle">trust you can run.</text><text x="670" y="138" font-size="12" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">03 &#183; WHAT AN AUDITOR ASKS</text><rect x="668" y="150" width="292" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><rect x="684" y="176" width="260" height="76" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="684" y="176" width="4" height="76" rx="2" ry="2" fill="#4493f8" stroke="#283341" stroke-width="1"/><text x="702" y="200" font-size="14.5" fill="#e6edf3" font-weight="600">Did anybody edit this?</text><text x="702" y="218" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">every seal after it fails</text><rect x="684" y="270" width="260" height="76" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="684" y="270" width="4" height="76" rx="2" ry="2" fill="#4493f8" stroke="#283341" stroke-width="1"/><text x="702" y="294" font-size="14.5" fill="#e6edf3" font-weight="600">Is anything missing?</text><text x="702" y="312" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">the chain is contiguous</text><rect x="684" y="364" width="260" height="76" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="684" y="364" width="4" height="76" rx="2" ry="2" fill="#4493f8" stroke="#283341" stroke-width="1"/><text x="702" y="388" font-size="14.5" fill="#e6edf3" font-weight="600">Is this all of it?</text><text x="702" y="406" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">the answer carries its span</text><rect x="684" y="458" width="260" height="76" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="684" y="458" width="4" height="76" rx="2" ry="2" fill="#4493f8" stroke="#283341" stroke-width="1"/><text x="702" y="482" font-size="14.5" fill="#e6edf3" font-weight="600">Can you prove it now?</text><text x="702" y="500" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">or say plainly that it cannot</text><text x="688" y="588" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">A question answered by a contiguous</text><text x="688" y="607" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">range is the completeness proof.</text><text x="688" y="626" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Scattered rows cannot make one.</text><text x="998" y="138" font-size="12" fill="#3fb950" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">04 &#183; WHO READS IT</text><rect x="996" y="150" width="244" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><rect x="1012" y="176" width="212" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="1012" y="176" width="4" height="62" rx="2" ry="2" fill="#3fb950" stroke="#283341" stroke-width="1"/><text x="1030" y="200" font-size="14.5" fill="#e6edf3" font-weight="600">an auditor</text><text x="1030" y="218" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">with the offline verifier,</text><text x="1030" y="235" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">and no access to you</text><rect x="1012" y="254" width="212" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="1012" y="254" width="4" height="62" rx="2" ry="2" fill="#3fb950" stroke="#283341" stroke-width="1"/><text x="1030" y="278" font-size="14.5" fill="#e6edf3" font-weight="600">the estate</text><text x="1030" y="296" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">stack-up runs the seal at</text><text x="1030" y="313" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">06:57 by default</text><rect x="1012" y="332" width="212" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="1012" y="332" width="4" height="62" rx="2" ry="2" fill="#3fb950" stroke="#283341" stroke-width="1"/><text x="1030" y="356" font-size="14.5" fill="#e6edf3" font-weight="600">kubernetes</text><text x="1030" y="374" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">a nightly job packs the</text><text x="1030" y="391" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">ledger and checks the pack</text><line x1="1012" y1="424" x2="1224" y2="424" stroke="#222b38" stroke-width="1" opacity="0.9"/><text x="1016" y="452" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">measured 2026-08-28</text><text x="1016" y="476" font-size="12" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">26 events on the bus</text><text x="1016" y="496" font-size="12" fill="#3fb950" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">9 sealed in the same run</text><text x="1016" y="516" font-size="12" fill="#e3b341" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">the rest refused by design</text><text x="1016" y="566" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">The console has no panel</text><text x="1016" y="584" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">for this plane yet, so what</text><text x="1016" y="602" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">is sealed is read with the</text><text x="1016" y="620" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">CLI rather than in a browser.</text><path d="M 342 401 L 351 410 L 342 419" fill="none" stroke="#ff6b63" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 642 401 L 651 410 L 642 419" fill="none" stroke="#ff6b63" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 970 401 L 979 410 L 970 419" fill="none" stroke="#ff6b63" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>