[package]
name = "trailryx-federation"
description = "Composing an answer across environments, and refusing to call it complete when it is not"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
trailryx-contracts = { path = "../trailryx-contracts" }
# Both were already in this crate's tree through `trailryx-store`; named here
# because verified replication uses them directly, and a dependency reached
# through somebody else is a dependency that disappears when they drop it.
trailryx-crypto = { path = "../trailryx-crypto" }
trailryx-journal = { path = "../trailryx-journal" }
trailryx-record = { path = "../trailryx-record" }
trailryx-store = { path = "../trailryx-store" }

[lints]
workspace = true
