[package]
name = "trailryx-store"
description = "The seam between the journal and the authenticated index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
trailryx-contracts = { path = "../trailryx-contracts" }
trailryx-crypto = { path = "../trailryx-crypto" }
trailryx-publish = { path = "../trailryx-publish" }
trailryx-index = { path = "../trailryx-index" }
trailryx-journal = { path = "../trailryx-journal" }
trailryx-record = { path = "../trailryx-record" }
trailryx-sign = { path = "../trailryx-sign" }
trailryx-sim = { path = "../trailryx-sim" }

[dev-dependencies]
trailryx-verify = { path = "../trailryx-verify" }
# For `tests/anchored.rs`, which pins the two independent token readers together.
# A dev-dependency, so the store itself still does not depend on the anchor: when
# a store anchors is an operational decision and the seam is `Anchor`.
trailryx-anchor = { path = "../trailryx-anchor" }
# For the coverage assertions in `tests/anchored.rs`: the mapping is derived from a
# verifier report, so a real pack is the only honest input to it.
trailryx-compliance = { path = "../trailryx-compliance" }

[lints]
workspace = true
