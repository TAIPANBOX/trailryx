[package]
name = "trailryx-sql"
description = "The SQL facade: DataFusion over our projections, with predicates on the provable dimensions pushed into the authenticated index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Not the workspace's floor, and this is the one crate where the two differ. It is
# set by the dependencies, not by our code: pgwire 0.40, datafusion-postgres 0.18,
# arrow-pg 0.15 and datafusion-pg-catalog 0.18 declare 1.89 and DataFusion 54
# declares 1.88, each read from the crates.io index for the version in Cargo.lock
# on 2026-10-09. Nothing depends on this crate, so the higher floor stops here:
# every other crate has no third-party dependency or only ones that ask for less.
rust-version = "1.89"

# THE ONLY CRATE IN THIS WORKSPACE WITH THIRD-PARTY DEPENDENCIES.
#
# `docs/planning/trailryx-architecture.md` §3.2a requires the facade to be
# physically separable: on its own runtime, in its own threads, reading only
# projections, talking to the core over channels. The gate enforces the two halves
# of that boundary: every other crate has zero third-party dependencies, and the
# core builds and passes its tests with this crate absent.
[dependencies]
async-trait = "0.1"
datafusion = "54"
datafusion-postgres = "0.18"
futures = "0.3"
pgwire = "0.40"
# The runtime the facade lives on, in its OWN threads. architecture.md §3.2a requires
# the facade never to run on a shard core: tokio's scheduler would cost that shard the
# determinism deterministic simulation testing needs, and DST is the correctness method.
# `io-util` and `time` are for the refusal written to a connection past
# `Config::max_connections`: the bytes go out through `AsyncWriteExt` and the write is
# bounded, because everything done on a socket a stranger controls is bounded.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "macros",
  "io-util",
  "time",
] }
trailryx-contracts = { path = "../trailryx-contracts" }
trailryx-index = { path = "../trailryx-index" }
trailryx-projection = { path = "../trailryx-projection" }
trailryx-record = { path = "../trailryx-record" }
trailryx-store = { path = "../trailryx-store" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-postgres = "0.7"
trailryx-crypto = { path = "../trailryx-crypto" }
trailryx-journal = { path = "../trailryx-journal" }

[lints]
workspace = true
