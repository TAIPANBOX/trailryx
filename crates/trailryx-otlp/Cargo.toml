[package]
name = "trailryx-otlp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OTLP ingest and the OpenTelemetry GenAI semantic-convention mapper"

[dependencies]
trailryx-record = { path = "../trailryx-record" }
trailryx-crypto = { path = "../trailryx-crypto" }
trailryx-contracts = { path = "../trailryx-contracts" }
# The reader `otlpjson` drives. A dependency and not a copy: the grammar at the
# trust boundary must be one thing, so that a bound raised for JSON Lines ingest
# is the same bound OTLP/JSON gets.
trailryx-json = { path = "../trailryx-json" }

[dev-dependencies]
# The mapper's output only means something once it becomes records, and the
# child-before-parent defect lived exactly in that seam: each crate's own tests
# passed while the pair of them lost every causal edge.
trailryx-assemble = { path = "../trailryx-assemble" }
trailryx-sim = { path = "../trailryx-sim" }

[lints]
workspace = true
