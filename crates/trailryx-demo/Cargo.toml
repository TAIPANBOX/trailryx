[package]
name = "trailryx-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The eight acceptance steps, walked end to end"

[dependencies]
trailryx-assemble = { path = "../trailryx-assemble" }
trailryx-azure = { path = "../trailryx-azure" }
trailryx-contracts = { path = "../trailryx-contracts" }
trailryx-crypto = { path = "../trailryx-crypto" }
trailryx-crypto-aws = { path = "../trailryx-crypto-aws" }
trailryx-erasure = { path = "../trailryx-erasure" }
trailryx-index = { path = "../trailryx-index" }
trailryx-ingest = { path = "../trailryx-ingest" }
trailryx-journal = { path = "../trailryx-journal" }
trailryx-otlp = { path = "../trailryx-otlp" }
trailryx-record = { path = "../trailryx-record" }
trailryx-s3 = { path = "../trailryx-s3" }
trailryx-sign = { path = "../trailryx-sign" }
trailryx-sim = { path = "../trailryx-sim" }
trailryx-store = { path = "../trailryx-store" }
trailryx-verify = { path = "../trailryx-verify" }

[[bin]]
name = "trailryx-demo"
path = "src/main.rs"

# A file of OTLP/JSON lines in, records out. Its own binary rather than a flag on
# the demo: the demo is the acceptance run and must not grow a mode that skips
# most of it.
[[bin]]
name = "trailryx-jsonl"
path = "src/jsonl_main.rs"

# The kill run: a real process killed by the operating system on a real filesystem.
# Its own binary because it spawns itself, and a flag on another binary would make
# that confusing to read in a process list.
[[bin]]
name = "trailryx-kill"
path = "src/kill_main.rs"

# Append rate on one shard at several sync policies. A binary rather than a test
# because it measures instead of asserting: as a `#[test]` it could never fail, and
# `scripts/readme-numbers.sh` would then count it as coverage it is not.
[[bin]]
name = "trailryx-rate"
path = "src/rate_main.rs"

[features]
# Reaching a real cloud endpoint from the acceptance run, which every one of them
# is `https`. Off by default: the run against an emulator needs nothing.
tls = ["trailryx-s3/tls", "trailryx-azure/tls"]

[lints]
workspace = true

[dev-dependencies]
# Only tests/manifest.rs uses it, to read components.json and the output of
# `cargo metadata`. This crate is one of the four on declared-deps.sh's
# allow-list, which is why the manifest test lives here rather than beside the
# binary it mostly talks about: the zero-dependency rule for the core and the
# verifier is not worth bending for a test fixture.
serde_json = "1"
