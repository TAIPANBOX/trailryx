[package]
name = "trailryx-azure"
description = "Azure Blob Storage over the workspace's own HTTP client, with Shared Key signing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Zero third-party dependencies, like the S3 adapter. Azure's Shared Key signature
# is one HMAC and two canonicalisations, both of which the workspace already has.
[dependencies]
trailryx-contracts = { path = "../trailryx-contracts" }
trailryx-crypto = { path = "../trailryx-crypto" }
trailryx-http = { path = "../trailryx-http" }

[features]
# Reaching a real endpoint, which every cloud one is: `https` only. Off by default
# so the crate keeps its zero third-party dependencies unless a deployment asks for
# the connection this needs, and on it links the same rustls the cryptographic
# provider already brings, rather than a second implementation of TLS.
tls = ["trailryx-http/tls"]

[lints]
workspace = true
